version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    command: "postgres -c max_connections=300"
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-logs
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler-node1:
    build: .
    environment:
      NODE_ID: node-1
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scheduler_db
      DB_USER: scheduler
      DB_PASSWORD: scheduler_pass
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEDULER_POLL_BATCH_SIZE: 50
      SCHEDULER_POLL_INTERVAL_MS: 500
      SCHEDULER_WORKER_POOL_SIZE: 20
      SCHEDULER_REBALANCE_COOLDOWN_SEC: 15
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduler-node2:
    build: .
    environment:
      NODE_ID: node-2
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scheduler_db
      DB_USER: scheduler
      DB_PASSWORD: scheduler_pass
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEDULER_POLL_BATCH_SIZE: 50
      SCHEDULER_POLL_INTERVAL_MS: 500
      SCHEDULER_WORKER_POOL_SIZE: 20
      SCHEDULER_REBALANCE_COOLDOWN_SEC: 15
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduler-node3:
    build: .
    environment:
      NODE_ID: node-3
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: scheduler_db
      DB_USER: scheduler
      DB_PASSWORD: scheduler_pass
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEDULER_POLL_BATCH_SIZE: 50
      SCHEDULER_POLL_INTERVAL_MS: 500
      SCHEDULER_WORKER_POOL_SIZE: 20
      SCHEDULER_REBALANCE_COOLDOWN_SEC: 15
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:

